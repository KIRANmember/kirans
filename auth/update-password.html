<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0f18"><title>Choose a new password | PillMate</title><link rel="stylesheet" href="/auth/auth.css"></head><body><main class="auth-shell"><a class="brand" href="/" aria-label="PillMate home"><span class="brand-mark"></span>PillMate</a><section class="card"><p class="eyebrow">Almost there</p><h1>Choose a new password</h1><p class="intro">Create a new password for your PillMate account.</p><form data-auth-form="update"><div class="field"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div><button class="submit" type="submit" data-label="Update password">Update password</button><div class="message" data-message role="status" aria-live="polite"></div></form><div class="foot"><a class="link" href="/auth/login.html">Back to log in</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth/supabase-config.js"></script><script src="/auth/auth.js"></script></body></html>
