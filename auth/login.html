<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0f18"><title>Log in | PillMate</title><link rel="stylesheet" href="/auth/auth.css"></head><body><main class="auth-shell"><a class="brand" href="/" aria-label="PillMate home"><span class="brand-mark"></span>PillMate</a><section class="card"><p class="eyebrow">Your routine, in safe hands</p><h1>Welcome back</h1><p class="intro">Log in to manage your medication routine and stay on top of refills.</p><form data-auth-form="login"><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="toggle-pass" type="button" data-toggle-password="password">Show</button></div></div><div class="row-between"><span></span><a class="link" href="/auth/forgot-password.html">Forgot password?</a></div><button class="submit" type="submit" data-label="Log in">Log in</button><div class="message" data-message role="status" aria-live="polite"></div></form><div class="foot">New to PillMate? <a class="link" href="/auth/signup.html">Create an account</a></div></section><a class="back" href="/">← Back to thekiran.in</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth/supabase-config.js"></script><script src="/auth/auth.js"></script></body></html>
